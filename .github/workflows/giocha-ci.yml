on:
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: giofchar_test
        ports:
          - 3309:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3309
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: giofchar_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up private brand package access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BRAND_TOKENS_DEPLOY_KEY }}
      - name: Install dependencies
        run: npm ci
      - name: Run test migrations
        run: npm run db:migrate:test
      - name: Automated Test
        run: npm test
